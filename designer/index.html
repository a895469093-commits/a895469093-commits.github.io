<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Design Your Own Tee</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#f2f3f7;min-height:100vh;padding-bottom:120px}
.top{background:linear-gradient(135deg,#111128,#232355);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
.top .logo{width:34px;height:34px;border-radius:9px;background:#ff2d6e;display:flex;align-items:center;justify-content:center;font-weight:800}
.top h1{font-size:17px;font-weight:700}
.top p{font-size:11px;opacity:.75}
.stage{position:relative;width:100%;max-width:420px;margin:16px auto;background:#fff;border-radius:16px;padding:10px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.shirt-wrap{position:relative;width:100%}
svg.shirt{width:100%;height:auto;display:block}
.print-zone{position:absolute;top:31%;left:31%;width:38%;height:32%}
canvas#c{width:100%!important;height:100%!important;outline:1px dashed rgba(0,0,0,.15);outline-offset:2px}
.toolbar{position:fixed;bottom:0;left:0;right:0;background:#fff;box-shadow:0 -4px 16px rgba(0,0,0,.08);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.btn{flex:0 0 auto;padding:10px 14px;border-radius:10px;border:1px solid #e3e3ea;background:#fff;font-size:13px;font-weight:600;color:#333;cursor:pointer}
.btn:active{background:#f0f0f5}
.btn.primary{background:#ff2d6e;border-color:#ff2d6e;color:#fff;flex:1}
.btn.green{background:#07c160;border-color:#07c160;color:#fff;flex:1}
.row2{display:flex;gap:8px;margin-top:8px}
.colors{display:flex;gap:8px;margin-top:8px;align-items:center}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ccc;cursor:pointer}
.swatch.sel{box-shadow:0 0 0 2px #ff2d6e}
.lbl{font-size:12px;color:#888;margin-right:4px}
select.size{padding:8px 10px;border-radius:8px;border:1px solid #e3e3ea;font-size:13px}
.tip{text-align:center;font-size:12px;color:#999;padding:8px}
.hidden{display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50}
.modal .box{background:#fff;border-radius:14px;padding:20px;width:82%;max-width:340px;text-align:center}
.modal input[type=text]{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin:12px 0}
.modal .btn{margin-top:6px;width:100%}
#savedImg{max-width:100%;border-radius:8px;margin-top:10px}
</style>
</head>
<body>

<div class="top">
  <div class="logo">T</div>
  <div>
    <h1>Design Your Own Tee</h1>
    <p>Upload a picture · Place it · Order in 1 minute</p>
  </div>
</div>

<div class="stage">
  <div class="shirt-wrap">
    <svg class="shirt" viewBox="0 0 300 340" xmlns="http://www.w3.org/2000/svg">
      <path id="shirtBody" fill="#ffffff" stroke="#d8d8e0" stroke-width="2"
        d="M100 20 L75 32 L30 62 L48 108 L70 96 L70 310 Q70 322 82 322 L218 322 Q230 322 230 310 L230 96 L252 108 L270 62 L225 32 L200 20 Q170 42 100 20 Z"/>
      <path d="M100 20 Q170 42 200 20" fill="none" stroke="#d8d8e0" stroke-width="2"/>
    </svg>
    <div class="print-zone"><canvas id="c"></canvas></div>
  </div>
  <div class="tip">Drag to move · pinch/corners to resize</div>
</div>

<div class="toolbar">
  <div class="row">
    <button class="btn" onclick="document.getElementById('file').click()">📷 Upload</button>
    <button class="btn" onclick="addText()">✏️ Add Text</button>
    <button class="btn" onclick="bringFront()">⬆️ Front</button>
    <button class="btn" onclick="removeSel()">🗑️ Delete</button>
    <input type="file" id="file" accept="image/*" class="hidden">
  </div>
  <div class="row2">
    <span class="lbl">Color</span>
    <div class="colors" id="colors"></div>
    <span class="lbl" style="margin-left:8px">Size</span>
    <select class="size" id="size">
      <option>S</option><option selected>M</option><option>L</option><option>XL</option><option>2XL</option><option>3XL</option>
    </select>
  </div>
  <div class="row2">
    <button class="btn green" onclick="saveDesign()">💾 Save Design</button>
    <button class="btn primary" onclick="orderNow()">🛒 Order Now</button>
  </div>
</div>

<div class="modal hidden" id="textModal">
  <div class="box">
    <b>Add Text</b>
    <input type="text" id="textInput" placeholder="Type something..." maxlength="40">
    <button class="btn primary" onclick="applyText()">OK</button>
  </div>
</div>

<div class="modal hidden" id="savedModal">
  <div class="box">
    <b>Your design is ready 🎉</b>
    <p style="font-size:12px;color:#888;margin-top:8px">Long-press the image to save it, then send it to the shop chat after ordering.</p>
    <img id="savedImg">
    <button class="btn primary" onclick="document.getElementById('savedModal').classList.add('hidden')">Done</button>
  </div>
</div>

<script>
// ====== 店铺链接(可配置):下单按钮跳转这里 ======
const SHOP_LINK = "https://www.tiktok.com/";

const canvas = new fabric.Canvas('c');
canvas.backgroundColor = 'transparent';

// 初始化画布尺寸
function fitCanvas() {
  const zone = document.querySelector('.print-zone');
  canvas.setDimensions({ width: zone.clientWidth, height: zone.clientHeight });
}
setTimeout(fitCanvas, 60);
window.addEventListener('resize', fitCanvas);

// 上传图片
document.getElementById('file').addEventListener('change', function (e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function (ev) {
    fabric.Image.fromURL(ev.target.result, function (img) {
      const w = canvas.getWidth(), h = canvas.getHeight();
      const scale = Math.min(w / img.width, h / img.height) * 0.85;
      img.set({ left: w/2, top: h/2, originX: 'center', originY: 'center', scaleX: scale, scaleY: scale });
      canvas.add(img).setActiveObject(img);
    });
  };
  reader.readAsDataURL(file);
  this.value = '';
});

// 加文字
function addText() {
  document.getElementById('textModal').classList.remove('hidden');
  setTimeout(() => document.getElementById('textInput').focus(), 100);
}
function applyText() {
  const v = document.getElementById('textInput').value.trim();
  if (v) {
    const t = new fabric.IText(v, {
      left: canvas.getWidth()/2, top: canvas.getHeight()/2,
      originX: 'center', originY: 'center',
      fontFamily: 'Arial', fill: '#222',
      fontSize: Math.round(canvas.getWidth() / 9),
    });
    canvas.add(t).setActiveObject(t);
  }
  document.getElementById('textInput').value = '';
  document.getElementById('textModal').classList.add('hidden');
}

function bringFront() {
  const a = canvas.getActiveObject();
  if (a) canvas.bringToFront(a);
}
function removeSel() {
  const a = canvas.getActiveObject();
  if (a) { canvas.remove(a); canvas.discardActiveObject(); }
}

// T恤颜色
const COLORS = ['#ffffff', '#111111', '#8f96a3', '#1f3a5f', '#e33434', '#f6c445'];
const colorBox = document.getElementById('colors');
COLORS.forEach((c, i) => {
  const d = document.createElement('div');
  d.className = 'swatch' + (i === 0 ? ' sel' : '');
  d.style.background = c;
  d.onclick = () => {
    document.getElementById('shirtBody').setAttribute('fill', c);
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('sel'));
    d.classList.add('sel');
  };
  colorBox.appendChild(d);
});

// 保存设计(合成 T恤+图案)
function saveDesign() {
  const shirtSvg = document.querySelector('svg.shirt');
  const scale = 2.5;
  const W = shirtSvg.clientWidth * scale, H = shirtSvg.clientHeight * scale;
  const out = document.createElement('canvas');
  out.width = W; out.height = H;
  const ctx = out.getContext('2d');
  const shirtFill = document.getElementById('shirtBody').getAttribute('fill');
  const zone = document.querySelector('.print-zone');
  const zr = shirtSvg.getBoundingClientRect();

  // 画 T 恤轮廓(简化路径,同 SVG)
  function drawShirt(ctx, w, h, fill) {
    const p = new Path2D("M100 20 L75 32 L30 62 L48 108 L70 96 L70 310 Q70 322 82 322 L218 322 Q230 322 230 310 L230 96 L252 108 L270 62 L225 32 L200 20 Q170 42 100 20 Z");
    ctx.save();
    ctx.scale(w/300, h/340);
    ctx.fillStyle = fill; ctx.fill(p);
    ctx.strokeStyle = '#d8d8e0'; ctx.lineWidth = 2; ctx.stroke(p);
    ctx.restore();
  }
  drawShirt(ctx, W, H, shirtFill);

  // 画设计内容
  const design = canvas.toDataURL();
  const img = new Image();
  img.onload = function () {
    const zx = zone.getBoundingClientRect();
    ctx.drawImage(img, (zx.left - zr.left) * scale, (zx.top - zr.top) * scale, zx.width * scale, zx.height * scale);
    const url = out.toDataURL('image/png');
    const show = document.getElementById('savedImg');
    show.src = url;
    document.getElementById('savedModal').classList.remove('hidden');
    // 尝试触发下载
    const a = document.createElement('a');
    a.href = url; a.download = 'my-tee-design.png'; a.click();
  };
  img.src = design;
}

// 下单
function orderNow() {
  const size = document.getElementById('size').value;
  alert('Step 1: Save your design image (just done if you tapped Save)\nStep 2: Order size ' + size + ' in our shop, then send the design image to the shop chat.\nRedirecting to our shop...');
  window.open(SHOP_LINK, '_blank');
}
</script>
</body>
</html>
